name: Blast Radius
on: pull_request

permissions:
  pull-requests: write   # post / update the blast-radius comment
  checks: write          # create the "Blast Radius" check run
  contents: read

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      # Pin to a tag or commit SHA in real use (here @v1, a moving major tag).
      - uses: gangix/blast-radius@v1
        with:
          # DataHub reachable from the GitHub runner. Local DataHub? Expose it with
          # a tunnel (cloudflared tunnel --url http://localhost:8080) and put that
          # https URL in the DATAHUB_GMS_URL secret.
          datahub-gms-url: ${{ secrets.DATAHUB_GMS_URL }}
          datahub-token:   ${{ secrets.DATAHUB_TOKEN }}
          # DataHub frontend URL, so asset links in the comment are clickable.
          link-base:       ${{ secrets.DATAHUB_FRONTEND_URL }}

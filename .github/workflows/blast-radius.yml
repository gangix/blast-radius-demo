name: Blast Radius
on: pull_request

permissions:
  pull-requests: write   # post / update the blast-radius comment
  checks: write          # create the "Blast Radius" check run
  contents: read

jobs:
  blast-radius:
    runs-on: ubuntu-latest
    steps:
      # Replace OWNER with the account/org where you published the Blast Radius
      # action repo (e.g. your-org/blast-radius). Pin to a tag or SHA in real use.
      - uses: OWNER/blast-radius@v1
        with:
          # Must be a DataHub reachable from the GitHub runner (a hosted instance,
          # or your local one exposed via a tunnel / self-hosted runner — the cloud
          # runner cannot reach localhost:8080).
          datahub-gms-url: ${{ secrets.DATAHUB_GMS_URL }}
          datahub-token:   ${{ secrets.DATAHUB_TOKEN }}
          # DataHub frontend URL, so asset links in the comment are clickable.
          link-base:       ${{ secrets.DATAHUB_FRONTEND_URL }}
